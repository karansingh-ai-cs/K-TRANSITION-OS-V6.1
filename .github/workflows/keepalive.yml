name: Keep Render Alive

on:
  schedule:
    # Har 10 minute mein chalega
    - cron: '*/10 * * * *'
  workflow_dispatch: # Button se manually chalane ke liye

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://k-transition-os-v6-1.onrender.com/
